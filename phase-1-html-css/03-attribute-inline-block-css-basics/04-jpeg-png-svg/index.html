<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Line break and spacing practice</title>
</head>
<body>

  <!-- Practice from 3.30, 3.31, 3.33: using the br tag correctly -->
  <p>
    First line of a poem.<br />
    Second line right below it.<br />
    Third line, no extra paragraph needed.
  </p>

  <!-- Practice from 3.32: breaking lines in contact info -->
  <address>
    F8 Learning Center<br />
    123 Example Street, District 1<br />
    Ho Chi Minh City, Vietnam
  </address>

  <!-- Practice from 3.35: non-breaking space, keeps "10 GB" from wrapping across lines -->
  <p>Storage plan: 10&nbsp;GB included.</p>

</body>
</html>
