<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Highlight code</title>

        <!-- Nhúng code CSS của PrismJS -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-okaidia.min.css"
        />
    </head>
    <body>
        <!-- Code HTML -->
        <pre>
<code class="language-html">&lt;figure&gt;
    &lt;img src=&quot;/images/appple.png&quot; alt=&quot;Apple&quot; /&gt;
    &lt;figcaption&gt;An Apple&lt;/figcaption&gt;
&lt;/figure&gt;</code>
</pre>

        <!-- Code CSS -->
        <pre>
<code class="language-css">* {
    padding: 0;
    margin: 0;
}</code>
</pre>

        <!-- Nhúng code JavaScript của PrismJS -->
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    </body>
</html>
