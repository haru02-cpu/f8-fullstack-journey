<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Href hash and contact links practice</title>
</head>
<body>

  <h1 id="top">Page top</h1>

  <!-- Practice from 3.15: href with hash + id, jump to a section on the same page -->
  <a href="#contact">Jump to contact section</a>

  <!-- Practice from 3.17-3.21: tel and mailto links -->
  <p>Call us: <a href="tel:+84123456789">+84 123 456 789</a></p>
  <p>Email us: <a href="mailto:hello@example.com">hello@example.com</a></p>

  <section id="contact">
    <h2>Contact</h2>
    <p>Phone: <a href="tel:+84123456789">+84 123 456 789</a></p>
    <p>Email: <a href="mailto:hello@example.com?subject=Hello">hello@example.com</a></p>
    <a href="#top">Back to top</a>
  </section>

</body>
</html>
