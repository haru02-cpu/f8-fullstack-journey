<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Home</title>

        <!-- Styles -->
        <link rel="stylesheet" href="./reset.css" />
        <link rel="stylesheet" href="./css/styles.css" />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Sou…"
            rel="stylesheet"
        />

        <!-- Icons -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
            integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfiThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk…"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <style>
            button {
                border: none;
                background: none;
                color: #fff;
            }

            .wrapper {
                display: flex;
                flex-direction: column;
                min-height: 100vh;
            }

            .header,
            .footer {
                min-height: 100px;
                background: #333;
                color: #fff;
            }

            .main {
                flex: 1;
            }

            .header,
            .footer,
            .main {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
                font-weight: 600;
                font-size: 26px;
            }

            .header {
                justify-content: space-between;
            }

            .drawer {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                z-index: 999;

                min-width: 150px;
                background: orange;
                translate: -100%;
                transition: translate ease 0.5s;
            }

            .drawer-close {
                position: absolute;
                top: 0;
                right: 0;
                padding: 6px 10px 10px;
            }

            .drawer-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.7);
                z-index: 998;
                opacity: 0;
                visibility: hidden;
                transition:
                    opacity ease 0.5s,
                    visibility ease 0.5s;
            }

            #drawer-input:checked ~ .drawer {
                translate: 0;
            }

            #drawer-input:checked ~ .drawer-overlay {
                opacity: 1;
                visibility: visible;
            }
        </style>
    </head>
    <body>
        <div class="wrapper">
            <div class="header">
                <label for="drawer-input">
                    <i class="fa-solid fa-bars"></i>
                </label>
            </div>
            <div class="main">Main</div>
            <div class="footer">Footer</div>

            <!-- Drawer -->
            <input type="checkbox" id="drawer-input" hidden />
            <div class="drawer-overlay"></div>
            <div class="drawer">
                <label for="drawer-input" class="drawer-close">
                    <i class="fa-solid fa-xmark"></i>
                </label>
                <ul>
                    <li>
                        <a href="">Item 1</a>
                    </li>
                    <li>
                        <a href="">Item 2</a>
                    </li>
                    <li>
                        <a href="">Item 3</a>
                    </li>
                    <li>
                        <a href="">Item 4</a>
                    </li>
                    <li>
                        <a href="">Item 5</a>
                    </li>
                </ul>
            </div>
        </div>
    </body>
</html>
