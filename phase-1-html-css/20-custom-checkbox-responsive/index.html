<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Home</title>

        <!-- Styles -->
        <link rel="stylesheet" href="./reset.css" />
        <link rel="stylesheet" href="./styles.css" />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Sou…"
            rel="stylesheet"
        />

        <!-- Icons -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
            integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfiThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk…"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
    </head>
    <body>
        <div class="wrapper">
            <div class="header">
                <label for="drawer-input">
                    <i class="fa-solid fa-bars"></i>
                </label>

                <label for="" class="custom-select">
                    <select name="" id="">
                        <option value="">Option 1</option>
                        <option value="">Option 2</option>
                        <option value="">Option 3</option>
                    </select>
                </label>
            </div>
            <div class="main">Main</div>
            <div class="footer">Footer</div>

            <!-- Toggle: On/Off -->

            <!-- Drawer -->
            <input type="checkbox" id="drawer-input" hidden />
            <label for="drawer-input" class="drawer-overlay"></label>
            <div class="drawer">
                <label for="drawer-input" class="drawer-close">
                    <i class="fa-solid fa-xmark"></i>
                </label>
                <ul>
                    <li>
                        <a href="">Item 1</a>
                    </li>
                    <li>
                        <a href="">Item 2</a>
                    </li>
                    <li>
                        <a href="">Item 3</a>
                    </li>
                    <li>
                        <a href="">Item 4</a>
                    </li>
                    <li>
                        <a href="">Item 5</a>
                    </li>
                </ul>
            </div>
        </div>
    </body>
</html>
