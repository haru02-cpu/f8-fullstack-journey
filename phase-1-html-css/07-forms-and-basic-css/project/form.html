<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Register</title>
        <link rel="stylesheet" href="./css/reset.css" />
        <link rel="stylesheet" href="./css/form-style.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
    </head>
    <body>
        <div class="content">
            <div class="form-container">
                <div class="form-header">
                    <h1 class="title">Create Your Profile</h1>
                    <p class="subtitle">Complete your account information</p>
                </div>
                <div class="form-info">
                    <div class="info-wrapper">
                        <div class="info-name">
                            <label
                                ><span class="label-title">Display Name</span>
                                <div class="input-wrapper">
                                    <i class="fa-regular fa-user"></i>
                                    <input
                                        class="text-input"
                                        class="form-box"
                                        type="text"
                                        placeholder="Enter your displey name"
                                    />
                                </div>
                            </label>
                        </div>
                        <div class="info-email">
                            <label
                                ><span class="label-title">Email</span>
                                <div class="input-wrapper">
                                    <i class="fa-regular fa-envelope"></i>
                                    <input
                                        class="text-input"
                                        class="form-box"
                                        type="email"
                                        placeholder="you@example.com"
                                    />
                                </div>
                            </label>
                        </div>
                    </div>
                    <div class="info-wrapper">
                        <div class="info-call">
                            <label
                                ><span class="label-title">Phone Number</span>
                                <div class="input-wrapper">
                                    <i class="fa-solid fa-phone"></i>
                                    <input
                                        class="text-input"
                                        type="number"
                                        placeholder="e.g., 0123 456 789"
                                    />
                                </div>
                            </label>
                        </div>
                        <div class="info-password">
                            <label
                                ><span class="label-title">Password</span>
                                <div class="input-wrapper">
                                    <i class="fa-solid fa-lock"></i>
                                    <input
                                        class="text-input"
                                        type="text"
                                        placeholder="Create a strong password"
                                    />
                                </div>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="form-confirm">
                    <label
                        ><span class="label-title">Confirm Password</span>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock"></i>
                            <input
                                class="text-input"
                                type="text"
                                placeholder="Re-enter your password"
                            />
                        </div>
                    </label>
                </div>
                <div class="form-gender">
                    <span class="label-title">Gender</span>
                    <div class="gender-wrapper">
                        <label class="gender-group">
                            <input type="radio" name="gender" value="Male" />
                            <span>Male</span>
                        </label>

                        <label class="gender-group">
                            <input type="radio" name="gender" value="Female" />
                            <span>Female</span>
                        </label>

                        <label class="gender-group">
                            <input type="radio" name="gender" value="Other" />
                            <span>Other</span>
                        </label>
                    </div>
                </div>
                <div class="form-dob">
                    <label class="dob-wrapper">
                        <span class="label-title">Date of Birth</span>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-calendar"></i>
                            <input
                                class="input-date"
                                type="date"
                                name=""
                                id=""
                            />
                        </div>
                    </label>
                </div>
                <div class="form-address"></div>
                <div class="form-avatar"></div>
                <div class="form-preferences"></div>
                <div class="form-choices"></div>
            </div>
        </div>
    </body>
</html>
