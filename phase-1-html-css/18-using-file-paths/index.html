<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>URL</title>
    </head>
    <body>
        <h1>
            <a
                href="https://fullstack.edu.vn/blog/tong-hop-cac-san-pham-cua-hoc-vien-tai-f8.html"
            >
                Tới trang web F8
            </a>
        </h1>
        <!-- 
        https://fullstack.edu.vn/blog/tong-hop-cac-san-pham-cua-hoc-vien-tai-f8.html?key1=value1&key2=value2#heading-1
     
        1. protocol (giao thức)    
           - http
           - https
        2. domain name / IP (tên miền)
           - fullstack.edu.vn
           - google.com.vn
        3. port (cổng)
           - 80: http
           - 443: https
        4. path (tuyến đường)
           - /blog/tong-hop...
        5. query parameter (tham số truy vấn)
           - key1=value1&key2=value2 
        6. hash
           - #heading-1
    
    --></body>
</html>
