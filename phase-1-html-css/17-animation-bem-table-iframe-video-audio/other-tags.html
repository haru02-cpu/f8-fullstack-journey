<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Other Tags</title>

        <style>
            /* BEM - Block Element Modifier 
                -> block__element--modifier <-
                - block: btn
                - element: btn__inner
                - modifier: btn--primary, btn__inner--italic
            */
            * {
                padding: 0;
                margin: 0;
                box-sizing: border-box;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 5px;
                height: 100vh;
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    Oxygen,
                    Ubuntu,
                    Cantarell,
                    "Open Sans",
                    "Helvetica Neue",
                    sans-serif;
                background: #000;
            }

            .container {
                width: 800px;
                max-width: 100%;
                margin: 0 auto;
            }

            .table {
                width: 100%;

                border-spacing: 0;
                border-collapse: collapse;
            }

            .table th,
            .table td {
                padding: 4px;
                /* border: 3px solid #ccc; */
                border-top: 1px solid #ccc;
                border-bottom: 1px solid #ccc;
            }

            .table th:first-child,
            .table td:first-child {
                border-right: 1px solid #ccc;
            }

            .table th {
                text-align: left;
            }

            iframe {
                width: 100vw;
                height: 100vh;
                border: none;
                flex-shrink: 0;
            }
        </style>
    </head>
