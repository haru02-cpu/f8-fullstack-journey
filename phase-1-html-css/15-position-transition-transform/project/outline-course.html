<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Outline Course</title>

        <!-- Reset CSS -->
        <link rel="stylesheet" href="./css/reset.css" />
        <!-- CSS -->
        <link rel="stylesheet" href="./css/outline-course.css" />

        <!-- Google Fonts: Inter -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div class="outline-course__wrapper">
            <div class="outline-course__sidebar">
                <div class="sidebar__banner">
                    <h1 class="sidebar__title">
                        Lộ trình <br />
                        Front-end Developer
                    </h1>
                    <p class="sidebar__desc">
                        Từ nền tảng đến thực chiến xây dựng sản phẩm web hiện
                        đại
                    </p>
                </div>

                <div class="sidebar__progress">
                    <h2 class="progress__title">Tiến độ học tập</h2>
                    <span class="progress__total-lessons">12 / 28 bài học</span>
                    <div class="progress-bar">
                        <progress value="12" max="28"></progress>
                        <span>43%</span>
                    </div>
                </div>

                <div class="outline-course__sidebar-list">
                    <nav>
                        <ul class="list-menu">
                            <li class="list-menu__item">
                                <a href="#!">Nội dung khóa học</a>
                            </li>
                            <li class="list-menu__item">
                                <a href="#!">Tổng quan khóa học</a>
                            </li>
                            <li class="list-menu__item">
                                <a href="#!">Tài liệu & tài nguyên</a>
                            </li>
                            <li class="list-menu__item">
                                <a href="#!">Dự án thực hành</a>
                            </li>
                            <li class="list-menu__item">
                                <a href="#!">Hỏi đáp</a>
                            </li>
                            <li class="list-menu__item">
                                <a href="#!">Ghi chú của tôi</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
            <div class="outline-course__main-content"></div>
        </div>
    </body>
</html>
