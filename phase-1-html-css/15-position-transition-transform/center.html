<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            * {
                padding: 0;
                margin: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    Oxygen,
                    Ubuntu,
                    Cantarell,
                    "Open Sans",
                    "Helvetica Neue",
                    sans-serif;
            }

            .container {
                position: relative;
                height: 300px;
                background: orange;
            }

            .item {
                position: absolute;
                top: 50%;
                left: 50%;
                translate: -50% -50%;
                width: 100px;
                height: 50px;
                background: green;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="item">ITEM</div>
        </div>
    </body>
</html>
