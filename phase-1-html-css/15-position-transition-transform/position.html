<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Position</title>
    </head>
    <body>
        <!-- 
        1. Nó phụ thuộc cái gì?
        - Relative: Mốc tính từ chính tọa độ ban đầu của phần tử 

        - Absolute: 
         + Mốc tính từ phần tử cha gần nhất có position khác là static
         + Đặt kích thước % là tỷ lệ theo phần tử làm mốc

        - Fixed: Mốc tính từ viewport.
        
        
        2. Có trong luồng (flow layout) hay không?
        - Relative: Có
        - Absolute: Không
        - Fixed: Không
        - Sticky: Relative + Fixed

        (top, right, bottom, left, z-index, inset)
        -->
    </body>
</html>
