<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            * {
                padding: 0;
                margin: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    Oxygen,
                    Ubuntu,
                    Cantarell,
                    "Open Sans",
                    "Helvetica Neue",
                    sans-serif;
            }

            .wrapper {
                display: flex;
                align-items: center;
                min-height: 100vh;
                overflow: hidden;
            }

            .album {
                position: relative;
                rotate: 45deg;
            }

            .inner {
                rotate: -45deg;
            }

            .album::before {
                content: "";
                position: absolute;
                inset: -20% -50% -60%;
                background: orange;
                transform: skew(3deg, 5deg);
            }

            .inner {
                position: relative;
                z-index: 1;
                width: 80%;
                margin: 0 auto;
            }
        </style>
    </head>
    <body>
        <div class="wrapper">
            <div class="album">
                <div class="inner">
                    <h1>Lorem ipsum dolor sit, amet.</h1>
                    <p>
                        Lorem ipsum dolor sit, amet consectetur adipisicing
                        elit. Illum delectus voluptatum minima obcaecati?
                        Perferendis incidunt, ut omnis sunt nobis, aliquid est
                        magni quas nesciunt obcaecati ducimus maiores natus quo
                        recusandae.
                    </p>
                </div>
            </div>
        </div>
    </body>
</html>
