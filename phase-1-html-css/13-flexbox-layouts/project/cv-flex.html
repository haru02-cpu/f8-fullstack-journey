<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CV Flex</title>
        <link rel="stylesheet" href="./css/reset.css" />
        <link rel="stylesheet" href="./css/cv-flex.css" />
        <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />
    </head>
    <body>
        <div class="content">
            <div class="cv-wrapper">
                <div class="cv-sidebar">
                    <div class="sidebar-header">
                        <img
                            src="./img/sidebar-avatar.jpg"
                            alt="Profile Avatar"
                            class="header-avatar"
                        />
                        <span class="header-name">Haru Huynh</span>
                        <span class="header-role">Software Engineer</span>
                    </div>
                    <span class="sidebar-line"></span>
                    <div class="sidebar-info">
                        <div class="info-item">
                            <i class="fa-regular fa-envelope"></i>
                            <a href="#!" class="info-link info-email"
                                >haruhuynh2208@gmail.com</a
                            >
                        </div>

                        <div class="info-item">
                            <i class="fa-solid fa-phone"></i>
                            <a href="#!" class="info-link info-phone"
                                >+84 912 345 678</a
                            >
                        </div>

                        <div class="info-item">
                            <i class="fa-solid fa-location-dot"></i>
                            <a href="#!" class="info-link info-location"
                                >TP. Hồ Chí Minh, Việt Nam</a
                            >
                        </div>

                        <div class="info-item">
                            <i class="fa-brands fa-linkedin"></i>
                            <a href="#!" class="info-link info-linkedin"
                                >linkedin.com/in/haru-huynh</a
                            >
                        </div>
                        <div class="info-item">
                            <i class="fa-solid fa-earth-asia"></i>
                            <a href="#!" class="info-link info-website"
                                >haru-huynh.dev</a
                            >
                        </div>
                    </div>
                    <span class="sidebar-line"></span>

                    <div class="sidebar-skills">
                        <div class="skills-title">KỸ NĂNG</div>
                        <label for="html-skill" class="skill-name">HTML</label>
                        <div class="progress-wrapper">
                            <progress
                                id="html-skill"
                                class="progress-bar html-val"
                                value="85"
                                max="100"
                            >
                                85%
                            </progress>
                            <span>85%</span>
                        </div>

                        <label for="html-skill" class="skill-name">CSS</label>
                        <div class="progress-wrapper">
                            <progress
                                id="css-skill"
                                class="progress-bar css-val"
                                value="80"
                                max="100"
                            >
                                80%
                            </progress>
                            <span>80%</span>
                        </div>

                        <label for="html-skill" class="skill-name"
                            >Javascript</label
                        >
                        <div class="progress-wrapper">
                            <progress
                                id="js-skill"
                                class="progress-bar js-val"
                                value="75"
                                max="100"
                            >
                                75%
                            </progress>
                            <span>75%</span>
                        </div>
                        <label for="html-skill" class="skill-name"
                            >Node JS</label
                        >
                        <div class="progress-wrapper">
                            <progress
                                id="njs-skill"
                                class="progress-bar njs-val"
                                value="70"
                                max="100"
                            >
                                70%
                            </progress>

                            <span>70%</span>
                        </div>
                    </div>
                    <span class="sidebar-line"></span>

                    <div class="sidebar-languages">
                        <div class="languages-title">NGÔN NGỮ</div>
                        <label for="vi-lang" class="lang-name"
                            >Tiếng Việt</label
                        >
                        <div class="progress-wrapper">
                            <progress
                                id="vi-lang"
                                class="progress-bar vietnamese"
                                value="100"
                                max="100"
                            >
                                100%
                            </progress>
                            <span>100%</span>
                        </div>

                        <label for="eng-lang" class="lang-name"
                            >Tiếng Anh</label
                        >
                        <div class="progress-wrapper">
                            <progress
                                id="eng-lang"
                                class="progress-bar english"
                                value="90"
                                max="100"
                            >
                                90%
                            </progress>
                            <span>90%</span>
                        </div>
                    </div>
                    <span class="sidebar-line"></span>

                    <div class="sidebar-quote">
                        <blockquote>
                            <p>
                                "Thiết kế những trài nghiệm đơn giản, hữu ích và
                                hướng đến mọi người."
                            </p>
                            <br />
                            <p>- Haru Huynh</p>
                        </blockquote>
                    </div>
                </div>
                <div class="cv-main"></div>
            </div>
        </div>
    </body>
</html>
