<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Product List</title>
        <link rel="stylesheet" href="./css/reset.css" />
        <link rel="stylesheet" href="./css/product-list.css" />

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />

        <!-- Font Awesome CDN -->
        <link rel="preconnect" href="https://cdnjs.cloudflare.com" />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />
    </head>
    <body>
        <header class="site-header">
            <div class="container header-inner">
                <a href="#!" class="site-logo">
                    <img
                        src="./img/product-list-logo.svg"
                        alt="Logo Moc Store"
                    />
                </a>

                <nav class="main-nav">
                    <ul class="main-list">
                        <li class="list-item"><a href="#!">Trang chủ</a></li>
                        <li class="list-item"><a href="#!">Sản phẩm</a></li>
                        <li class="list-item"><a href="#!">Câu chuyện</a></li>
                        <li class="list-item"><a href="#!">Liên hệ</a></li>
                    </ul>
                </nav>

                <form class="search-form" role="search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input
                        type="text"
                        placeholder="Tìm sản phẩm yêu thích..."
                    />
                </form>

                <a href="" class="cart-button"></a>

                <p class="header-slogan">
                    Những món đồ nhỏ làm nên cuộc sống tốt đẹp hơn
                </p>
            </div>
        </header>
    </body>
</html>
